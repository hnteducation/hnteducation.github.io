name: Check student management
on:
  push:
    paths: ['quanly.html', 'google_apps_script.js', 'tools/check-management.cjs', '.github/workflows/validate-management.yml']
  pull_request:
    paths: ['quanly.html', 'google_apps_script.js', 'tools/check-management.cjs', '.github/workflows/validate-management.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check-management.cjs
